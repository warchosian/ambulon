[tool.poetry]
name = "ambulon"
version = "0.2.0"
description = "Un projet simple pour afficher 'Hello Ambulon !' avec la version courante."
authors = ["Votre Nom <votre.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "ambulon", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
importlib-resources = "^6.0.0"

[tool.poetry.group.dev.dependencies]
commitizen = "^3.13.0"
pytest = "^8.0.0"
black = "^24.0.0"
isort = "^5.13.0"

[tool.poetry.scripts]
ambulon = "ambulon.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
tag_format = "$version"
version_files = [
    "pyproject.toml:version",
    "src/ambulon/__init__.py:__version__"
]
