[tool.poetry]
name = "ambulon"
version = "3.0.0"
description = "Suite complète d'outils de numérisation avec serveur MCP pour assistants IA."
authors = ["Votre Nom <votre.email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "app", from = "src"}]
include = [
    "config/piag.yaml.example",
    "config/gitlab.yaml.example",
    "config/wikisi.yaml.example",
    "config/README.md"
]

[tool.poetry.dependencies]
python = "^3.10"
importlib-resources = "^6.0.0"
pillow = "^10.0.0"
pymupdf = "^1.23.0"
requests = "^2.32.5"
pyyaml = "^6.0.0"
mcp = "^1.0.0"
chardet = "^5.2.0"
beautifulsoup4 = "^4.12.0"
lxml = "^5.0.0"
markdown = "^3.5.0"
python-slugify = "^8.0.0"
playwright = "^1.47.0"

[tool.poetry.group.dev.dependencies]
commitizen = "^3.13.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
isort = "^5.13.0"
pytesseract = "^0.3.10"
pillow = "^10.0.0"

[tool.poetry.scripts]
ambulon = "app.cli.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.commitizen]
name = "cz_conventional_commits"
version = "3.0.0"
tag_format = "$version"
version_files = [
    "pyproject.toml:version",
    "src/app/__init__.py:__version__"
]

